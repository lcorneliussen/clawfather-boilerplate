---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fail2ban
      - rsync # the deploy workflow syncs the repository with it
      - unattended-upgrades
      - ufw
    state: present
    update_cache: true

- name: Create deployment user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Install deployment SSH keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ deploy_authorized_keys }}"

# bin/claw creates data directories as uid 1000 and the deploy workflow runs
# the rollout as a transient systemd unit; both need root without a prompt.
- name: Allow passwordless sudo for deployment automation
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Harden SSH authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-claw-hardening.conf
    # No ListenAddress: sshd must stay reachable on the Docker bridge gateway,
    # where cloudflared delivers SSH through Access.
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      AllowUsers root {{ deploy_user }}
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# ufw filters container-to-host traffic too, so this rule is what lets the
# tunnel reach sshd. Public port 22 is closed by the Hetzner firewall.
- name: Allow SSH through host firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Enable deny-by-default host firewall
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Never ban the tunnel connector
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/claw.local
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 {{ claw_subnet }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
