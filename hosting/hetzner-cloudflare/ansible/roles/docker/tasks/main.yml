---
# Docker CE from Docker's repository: the distribution packages lag behind and
# lack the compose plugin that bin/claw drives.
- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce=5:29.8.1-1~ubuntu.24.04~noble
      - docker-ce-cli=5:29.8.1-1~ubuntu.24.04~noble
      - containerd.io=2.3.6-1~ubuntu.24.04~noble
      - docker-buildx-plugin=0.37.1-1~ubuntu.24.04~noble
      - docker-compose-plugin=5.5.1-1~ubuntu.24.04~noble
    state: present
    update_cache: true

# bin/claw runs docker without sudo.
- name: Add deployment user to Docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
