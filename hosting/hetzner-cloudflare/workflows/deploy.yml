# Deploy: build the claw image, ship the repository to the host, and run
# `bin/claw deploy` there. The rollout itself (backup, configure, doctor,
# health, config rollback) lives in bin/claw, not here.
#
# TEMPLATE. Copy to .github/workflows/deploy.yml in the derived repo.
# Upstream-owned; changes arrive with boilerplate upgrades.
#
# Repository variables
#   CLAW_SSH_HOSTNAME     SSH hostname behind Access (tofu output ssh_hostname)
#   SSH_HOST_PUBLIC_KEY   the host's ed25519 key, "ssh-ed25519 AAAA…"
#   CLAW_DEPLOY_USER      optional, default deploy
#   CLAW_PLATFORM         optional, e.g. linux/arm64 for Hetzner cax servers
#
# Environment secrets (environment: production)
#   DEPLOY_SSH_PRIVATE_KEY    private half of the CI key in Ansible's deploy_authorized_keys
#   CF_ACCESS_CLIENT_ID       tofu output ci_access_client_id
#   CF_ACCESS_CLIENT_SECRET   tofu output ci_access_client_secret
#   CLOUDFLARE_TUNNEL_TOKEN   tofu output cloudflare_tunnel_token
#   CLAW_SECRETS_ENV          optional: further lines for .secrets/claw.env
#                             (model API keys, …), KEY=value, shell-quoted
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One rollout at a time, and never cancel one halfway: the host could be left
# between "gateway stopped" and "gateway up".
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      CLAW_IMAGE_TAG: ${{ github.sha }}
      CLAW_PLATFORM: ${{ vars.CLAW_PLATFORM }}
      SSH_HOST: ${{ vars.CLAW_SSH_HOSTNAME }}
      DEPLOY_USER: ${{ vars.CLAW_DEPLOY_USER || 'deploy' }}
      # `cloudflared access ssh` authenticates to Access with these.
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v5

      # Alternative: load the secrets from 1Password with a service account
      # instead of environment secrets. Later steps read them from the env.
      #
      # - name: Load deployment credentials from 1Password
      #   uses: 1password/load-secrets-action@v5
      #   with:
      #     export-env: true
      #   env:
      #     OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      #     TUNNEL_SERVICE_TOKEN_ID: op://<vault>/<access-service-token-item>/client id
      #     TUNNEL_SERVICE_TOKEN_SECRET: op://<vault>/<access-service-token-item>/client secret
      #     DEPLOY_SSH_PRIVATE_KEY: op://<vault>/<ci-ssh-key-item>/private key?ssh-format=openssh
      #     CLOUDFLARE_TUNNEL_TOKEN: op://<vault>/<tunnel-item>/token

      - name: Resolve the deployment
        run: |
          set -euo pipefail
          # GHCR names must be lowercase; repository names need not be.
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}-openclaw"
          export CLAW_IMAGE_NAME="$image_name"
          resolved="$(bin/claw env)"
          get() { sed -n "s/^$1=//p" <<<"$resolved"; }
          [[ "$(get CLAW_PROFILE)" == hetzner-cloudflare ]] || {
            echo "instance/claw.env: CLAW_PROFILE must be hetzner-cloudflare" >&2; exit 1; }
          [[ -n "$SSH_HOST" ]] || { echo "set the CLAW_SSH_HOSTNAME repository variable" >&2; exit 1; }
          instance="$(get CLAW_INSTANCE)"
          {
            echo "CLAW_IMAGE_NAME=$image_name"
            echo "CLAW_IMAGE=$(get CLAW_IMAGE)"
            echo "CLAW_INSTANCE=$instance"
            # Must match Ansible's claw_repo_dir.
            echo "REMOTE_DIR=/opt/$instance"
          } >> "$GITHUB_ENV"

      - name: Set up emulation for a foreign platform
        if: vars.CLAW_PLATFORM != ''
        uses: docker/setup-qemu-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: bin/claw build --push

      - name: Install the cloudflared client
        run: |
          set -euo pipefail
          # Pinned with its checksum; bump together with compose.yml.
          version=2026.9.1
          sha256=3be76adc4185d36a0bfb4c2dd8663292f0ed363797f2180333b513b43c81d419
          curl --fail --silent --show-error --location --output /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/$version/cloudflared-linux-amd64.deb"
          echo "$sha256  /tmp/cloudflared.deb" | sha256sum --check --strict
          sudo dpkg --install /tmp/cloudflared.deb

      - name: Configure SSH through Access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST_PUBLIC_KEY: ${{ vars.SSH_HOST_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST_PUBLIC_KEY" ]] || { echo "set the SSH_HOST_PUBLIC_KEY repository variable" >&2; exit 1; }
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/claw_deploy
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/claw_deploy
          # Pinned host key: the tunnel authenticates Cloudflare, this
          # authenticates the host behind it.
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host $SSH_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/claw_deploy
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/config
          ssh "$SSH_HOST" true
          # A cancelled earlier run can leave its rollout going on the host.
          if ssh "$SSH_HOST" "systemctl list-units --plain --no-legend --state=activating,running 'claw-deploy-*'" | grep -q .; then
            echo "another rollout is still running on the host" >&2
            exit 1
          fi

      - name: Sync the repository to the host
        run: |
          set -euo pipefail
          # .secrets/ and .data/ exist only on the host; excluded paths are
          # also protected from --delete.
          rsync --archive --compress --delete \
            --exclude=/.git --exclude=/.data --exclude=/.secrets \
            ./ "$SSH_HOST:$REMOTE_DIR/"

      - name: Write the host env (.secrets/claw.env)
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLAW_SECRETS_ENV: ${{ secrets.CLAW_SECRETS_ENV }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]] || { echo "missing CLOUDFLARE_TUNNEL_TOKEN" >&2; exit 1; }
          file="$RUNNER_TEMP/claw.env"
          install -m 0600 /dev/null "$file"
          {
            echo "# Written by the deploy workflow; changes here are overwritten."
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%q\n' "$CLOUDFLARE_TUNNEL_TOKEN"
            # Not secret, but host-local: which image this host runs, so an
            # operator's `bin/claw up|logs|openclaw` there resolves the same
            # image the rollout started.
            printf 'CLAW_IMAGE=%q\n' "$CLAW_IMAGE"
            if [[ -n "${CLAW_SECRETS_ENV:-}" ]]; then printf '%s\n' "$CLAW_SECRETS_ENV"; fi
          } > "$file"
          # bin/claw sources this file; refuse to ship one it cannot parse.
          bash -n "$file"
          # Replace atomically, never readable by anyone but the deploy user.
          ssh "$SSH_HOST" "umask 077 && mkdir -p '$REMOTE_DIR/.secrets' && chmod 0700 '$REMOTE_DIR/.secrets' \
            && cat > '$REMOTE_DIR/.secrets/claw.env.new' && mv -f '$REMOTE_DIR/.secrets/claw.env.new' '$REMOTE_DIR/.secrets/claw.env'" \
            < "$file"
          shred -u "$file"

      - name: Pull the image on the host
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The job token expires with the job; the host keeps no registry
          # credential beyond this step.
          logout() { ssh "$SSH_HOST" 'docker logout ghcr.io' >/dev/null 2>&1 || true; }
          trap logout EXIT
          printf '%s' "$REGISTRY_PASSWORD" | \
            ssh "$SSH_HOST" "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin" >/dev/null
          ssh "$SSH_HOST" "docker pull --quiet '$CLAW_IMAGE'"

      - name: Roll out with bin/claw deploy
        run: |
          set -euo pipefail
          # The rollout runs as a transient systemd unit, not in the SSH
          # session: that session travels through the cloudflared container,
          # and a deploy that recreates cloudflared would otherwise cut its
          # own connection halfway through. We start it, then poll.
          unit="claw-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "$SSH_HOST" "sudo systemd-run --quiet --unit='$unit' --uid='$DEPLOY_USER' \
            --service-type=exec --remain-after-exit --working-directory='$REMOTE_DIR' \
            --setenv=CLAW_IMAGE='$CLAW_IMAGE' --setenv=CLAW_BUILD=no \
            '$REMOTE_DIR/bin/claw' deploy"

          cursor=""
          show_logs() {
            local out next
            out="$(ssh "$SSH_HOST" "sudo journalctl --unit='$unit' --output=cat --no-pager --show-cursor ${cursor:+--after-cursor='$cursor'}" 2>/dev/null)" || return 0
            next="$(sed -n 's/^-- cursor: //p' <<<"$out" | tail -1)"
            [[ -n "$next" ]] && cursor="$next"
            sed '/^-- cursor: /d; /^-- No entries --$/d' <<<"$out"
          }

          result=""
          deadline=$((SECONDS + 45 * 60))
          while ((SECONDS < deadline)); do
            sleep 5
            show_logs
            # Unreachable while cloudflared restarts: keep waiting.
            state="$(ssh "$SSH_HOST" "systemctl show --property=ActiveState --property=SubState '$unit'" 2>/dev/null)" || continue
            case "$state" in
              *ActiveState=failed*|*ActiveState=inactive*) result=failed; break ;;
              *SubState=exited*) result=ok; break ;;
            esac
          done
          show_logs
          # Clean up only a finished unit. Stopping one that is still running
          # would interrupt bin/claw deploy past its rollback point.
          if [[ -n "$result" ]]; then
            ssh "$SSH_HOST" "sudo systemctl stop '$unit'; sudo systemctl reset-failed '$unit'" >/dev/null 2>&1 || true
          fi
          case "$result" in
            ok) echo "rollout finished" ;;
            failed) echo "rollout failed (bin/claw restored the previous config)" >&2; exit 1 ;;
            *) echo "rollout did not finish in time; it may still be running as $unit" >&2; exit 1 ;;
          esac

      - name: Show the stack
        run: ssh "$SSH_HOST" "cd '$REMOTE_DIR' && bin/claw status"

      - name: Remove temporary credentials
        if: always()
        run: shred -u ~/.ssh/claw_deploy 2>/dev/null || true
