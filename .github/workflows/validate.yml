# The boilerplate's own CI: static checks for core and every hosting profile,
# then the local profile end to end. Derived claws copy their profile's
# workflows from hosting/<profile>/workflows/ instead of this file.
name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Static checks
        run: tools/check
      - name: Publication guard tests
        run: python3 -I tests/publication_guard_test.py
      - name: Backport leak check tests
        run: tests/upstream_backport_test.sh

  local-e2e:
    # The local profile runs for real: build, configure, doctor, start, health,
    # and a second deploy to prove the rollout is repeatable.
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - name: First deploy
        run: bin/claw deploy
      - name: Second deploy (upgrade path over existing state)
        run: bin/claw deploy
      - name: Gateway answers and auth is token mode
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:18789/healthz
          bin/claw openclaw config get gateway.auth.mode | grep -q token
      - name: Logs on failure
        if: failure()
        run: bin/claw compose logs --no-color --tail 300
