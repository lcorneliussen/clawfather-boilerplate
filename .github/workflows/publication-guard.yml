# Name-dropping protection for the public boilerplate: every PR (title, body,
# branch, commit messages, changed file names and contents), issue, comment
# and review is scanned for the terms in the PUBLICATION_FORBIDDEN_TERMS
# secret — the private deployments this boilerplate is used by. Findings fail
# with a generic message only. See docs/publication-guard.md.
#
# Ported from wtc-boilerplate. Runs only in the boilerplate itself: a derived
# copy that inherits this file has no such secret and no public audience.
name: publication guard
run-name: Publication guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to inspect
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  guard:
    if: github.repository == 'lcorneliussen/clawfather-boilerplate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always run trusted default-branch code, including for fork PR events.
      # No PR checkout, dependencies, artifacts, caches or contributor scripts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # The scanner runs from the default branch only, so it cannot inspect
      # the PR that introduces it. Until it has landed there, say so instead
      # of failing on a missing file; from then on a missing scanner is
      # impossible without a merged change that removes it.
      - name: Scanner installed on the default branch?
        id: installed
        run: |
          if [[ -f tools/publication-guard.py ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Publication guard is not on the default branch yet; it activates when it lands there."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect publication data
        if: steps.installed.outputs.ready == 'true'
        env:
          PUBLICATION_FORBIDDEN_TERMS: ${{ secrets.PUBLICATION_FORBIDDEN_TERMS }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/publication-guard.py
